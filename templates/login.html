{% extends 'base.html' %}

{% block title %}Log in · Fins Surf Hire{% endblock %}

{% block header %}
	<header class="topbar">
		<a class="brand" href="/">Fins <span>Surf Hire</span></a>
	</header>
{% endblock %}

{% block body %}
	<main>
		<div class="shell shell-counter">
			<h1 class="page-title">Log in</h1>

			{% if error %}
				<p class="form-error" role="alert">{{ error }}</p>
			{% endif %}

			<form name="login_form" method="post" action="/admin/login" class="card form-card login-form">
				<label for="username">Username</label>
				<input id="username" type="text" name="username" value="{{ request.form.get('username', '') }}" autocomplete="username" autocapitalize="none" spellcheck="false" required {% if not error %}autofocus{% endif %}>

				<label for="password">Password</label>
				<input id="password" type="password" name="password" autocomplete="current-password" enterkeyhint="go" required {% if error %}autofocus{% endif %}>

				<button type="submit" class="btn btn-primary">Log in</button>
			</form>
		</div>
	</main>
{% endblock %}

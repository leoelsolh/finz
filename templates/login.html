<!DOCTYPE html>
<html>
<head>
    <h1>Login</h1>
    <h2>Admin Panel Login</h2>
</head>
<body>
    <form name="login_form" action="/admin/login" method="post">
        <div>
            <label>Username:</label>
            <input name="username">
        </div>
        <div>
            <label>Password:</label>
            <input type="password" name="password">
        </div>
        <div>
            <button type="submit">Continue</button>
        </div>
    </form>
</body>
</html>

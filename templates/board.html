{% extends 'base.html' %}

{% block title %}{{ board.name }} · Fins Surf Hire{% endblock %}

{% block body %}
	<section class="page-head">
		<div class="page-head-inner">
			<h1 class="display">{{ board.name }}</h1>
			<p class="page-head-sub">One of our boards, hired by the day</p>
		</div>
	</section>

	<main>
		<div class="shell shell-narrow">
			<div class="zone board-detail">
				<article class="card">
					<dl class="spec">
						<div>
							<dt>Size</dt>
							<dd>{{ board.size }}</dd>
						</div>
						<div>
							<dt>Day rate</dt>
							<dd>£{{ board.price }}</dd>
						</div>
					</dl>
				</article>
				<div class="board-detail-cta">
					<a class="btn btn-primary" href="/book">Book a board</a>
					<a class="btn btn-quiet" href="/boards">All boards</a>
				</div>
			</div>
		</div>
	</main>
{% endblock %}

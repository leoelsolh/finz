<!DOCTYPE html>
<html>
    <head>
        <h1>HillEnd Boards for Hire</h1>
    </head>
    <body>
        <div>
            <h4>All Boards</h4>

            {% endfor %}
        </div>
        <div>
            <h4>Free Boards</h4>
        </div>
    </body>
</html>

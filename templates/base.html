<!DOCTYPE html>
<html lang="en-GB">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{% block title %}Fins Surf Hire{% endblock %}</title>
	<link rel="preload" href="{{ url_for('static', filename='fonts/BricolageGrotesque-latin.woff2') }}" as="font" type="font/woff2" crossorigin>
	<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
	{% block header %}
	<header class="topbar">
		<a class="brand" href="/">Fins <span>Surf Hire</span></a>
		<nav class="site-nav">
			<a href="/boards">Boards</a>
			<a href="/hours">Hours</a>
			<a class="btn btn-primary nav-cta" href="/book">Book a board</a>
		</nav>
	</header>
	{% endblock %}
	{% block body %}{% endblock %}
</body>
</html>

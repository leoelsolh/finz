<!DOCTYPE html>
<html lang="en-GB">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{% block title %}Finz Surf Hire{% endblock %}</title>
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231A3A7A' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6.5 12c.94-3.46 4.94-6 8.5-6 3.56 0 6.06 2.54 7 6-.94 3.47-3.44 6-7 6s-7.56-2.53-8.5-6Z'/%3E%3Cpath d='M18 12v.5'/%3E%3Cpath d='M16 17.93a9.77 9.77 0 0 1 0-11.86'/%3E%3Cpath d='M7 10.67C7 8 5.58 5.97 2.73 5.5c-1 1.5-1 5 .23 6.5-1.24 1.5-1.24 5-.23 6.5C5.58 18.03 7 16 7 13.33'/%3E%3Cpath d='M10.46 7.26C10.2 5.88 9.17 4.24 8 3h5.8a2 2 0 0 1 1.98 1.67l.23 1.4'/%3E%3Cpath d='m16.01 17.93-.23 1.4A2 2 0 0 1 13.8 21H9.5a5.96 5.96 0 0 0 1.49-3.98'/%3E%3C/svg%3E">
	<link rel="preload" href="{{ url_for('static', filename='fonts/PlayfairDisplay-Italic-latin.woff2') }}" as="font" type="font/woff2" crossorigin>
	<link rel="preload" href="{{ url_for('static', filename='fonts/EBGaramond-latin.woff2') }}" as="font" type="font/woff2" crossorigin>
	<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body id="top">
	{% block header %}
	<input type="checkbox" id="nav-open" class="nav-toggle-box" aria-label="Menu">
	<header class="topbar">
		<a class="brand" href="/">
			<!-- Fish mark: the "fish" icon from Lucide (lucide.dev), ISC licence -->
			<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
				<path d="M6.5 12c.94-3.46 4.94-6 8.5-6 3.56 0 6.06 2.54 7 6-.94 3.47-3.44 6-7 6s-7.56-2.53-8.5-6Z"/>
				<path d="M18 12v.5"/>
				<path d="M16 17.93a9.77 9.77 0 0 1 0-11.86"/>
				<path d="M7 10.67C7 8 5.58 5.97 2.73 5.5c-1 1.5-1 5 .23 6.5-1.24 1.5-1.24 5-.23 6.5C5.58 18.03 7 16 7 13.33"/>
				<path d="M10.46 7.26C10.2 5.88 9.17 4.24 8 3h5.8a2 2 0 0 1 1.98 1.67l.23 1.4"/>
				<path d="m16.01 17.93-.23 1.4A2 2 0 0 1 13.8 21H9.5a5.96 5.96 0 0 0 1.49-3.98"/>
			</svg>
			Finz
		</a>
		<nav class="site-nav">
			<a href="/about">About</a>
			<a href="/ourwork">Our Work</a>
			<a href="/contact">Contact</a>
			<a class="btn nav-cta" href="/book">Book Online</a>
		</nav>
		<label for="nav-open" class="nav-burger">
			<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
				<path d="M3 6.5h18 M3 12h18 M3 17.5h18"/>
			</svg>
		</label>
	</header>
	<div class="nav-overlay">
		<label for="nav-open" class="nav-close">
			<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
				<path d="M5 5l14 14 M19 5L5 19"/>
			</svg>
		</label>
		<nav class="overlay-nav">
			<a href="/">Home</a>
			<a href="/about">About</a>
			<a href="/ourwork">Our Work</a>
			<a href="/contact">Contact</a>
			<a href="/book">Book Online</a>
		</nav>
	</div>
	{% endblock %}
	{% block body %}{% endblock %}
	{% block footer %}
	<footer class="site-footer">
		<p class="footer-brand">Finz</p>
		<h2 class="footer-heading">Contact us</h2>
		<p>Email Address - <a href="mailto:{{ shop_email }}">{{ shop_email }}</a></p>
		<p>Phone - <a href="tel:{{ shop_phone }}">{{ shop_phone }}</a></p>
		<address>
			<p>Hillend Campsite, Llangennith, Gower</p>
		</address>
		<div class="socials">
			<a href="#" aria-label="Instagram">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
					<rect x="3" y="3" width="18" height="18" rx="5"/>
					<circle cx="12" cy="12" r="4"/>
					<circle cx="17.4" cy="6.6" r="1.2" fill="currentColor" stroke="none"/>
				</svg>
			</a>
			<a href="#" aria-label="Facebook">
				<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
					<path d="M14 8.5V6.8c0-.7.4-1.1 1.2-1.1H17V3h-2.6C11.9 3 11 4.6 11 6.6v1.9H9v3h2V21h3v-9.5h2.4l.4-3z"/>
				</svg>
			</a>
		</div>
		<a class="to-top" href="#top" aria-label="Back to the top">
			<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
				<path d="M6 14l6-6 6 6"/>
			</svg>
		</a>
	</footer>
	{% endblock %}
</body>
</html>

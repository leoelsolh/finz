<!DOCTYPE html>
<html lang="en-GB">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{% block title %}Finz Surf Hire{% endblock %}</title>
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 46 20'%3E%3Cpath d='M9 10 C15 3.5 32 4 40 10 C32 16 15 16.5 9 10 Z M9 10 L2 5 M9 10 L2 15 M2 5 C3.5 8 3.5 12 2 15' fill='none' stroke='%231A3A7A' stroke-width='1.4'/%3E%3C/svg%3E">

	<link rel="preload" href="{{ url_for('static', filename='fonts/EBGaramond-latin.woff2') }}" as="font" type="font/woff2" crossorigin>
	<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body id="top">
	{% block header %}
	<input type="checkbox" id="nav-open" class="nav-toggle-box" aria-label="Menu">
	<header class="topbar">
		<a class="brand" href="/">
			<svg width="42" height="19" viewBox="0 0 46 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
				<path d="M9 10 C15 3.5 32 4 40 10 C32 16 15 16.5 9 10 Z"/>
				<path d="M9 10 L2 5 M9 10 L2 15 M2 5 C3.5 8 3.5 12 2 15"/>
				<path d="M4.5 7.3 L6.2 12.7 M6.8 6.3 L8.2 13.6"/>
				<path d="M31 6.4 C32.6 8.5 32.6 11.5 31 13.6"/>
				<path d="M40 10 L44.5 8.4 M40 10 L44.5 11.6"/>
				<circle cx="35" cy="8.6" r="1" fill="currentColor" stroke="none"/>
			</svg>
			Finz
		</a>
		<nav class="site-nav">
			<a href="/about">About</a>
			<a href="/ourwork">Our Work</a>
			<a href="/contact">Contact</a>
			<a class="btn nav-cta" href="/book">Book Online</a>
		</nav>
		<label for="nav-open" class="nav-burger">
			<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
				<path d="M3 6.5h18 M3 12h18 M3 17.5h18"/>
			</svg>
		</label>
	</header>
	<div class="nav-overlay">
		<label for="nav-open" class="nav-close">
			<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
				<path d="M5 5l14 14 M19 5L5 19"/>
			</svg>
		</label>
		<nav class="overlay-nav">
			<a href="/">Home</a>
			<a href="/about">About</a>
			<a href="/ourwork">Our Work</a>
			<a href="/contact">Contact</a>
			<a href="/book">Book Online</a>
		</nav>
	</div>
	{% endblock %}
	{% block body %}{% endblock %}

<!DOCTYPE html>
<html>
<head>
<h1>Admin Panel</h1>
    <div>
        <p>
            <h8>All Boards: </h8>
            {% for rental in rentals %}
                <p>{{ rental.name }} is out with {{ rental.name_booked }}</p>
                <form method="post" action="/admin/return">
                    <input type="hidden" name="board_id" value="{{ rental.board_id }}">
                    <button type="submit">Mark as Returned</button>
                </form>
            {% endfor %}
        </p>
    </div>
</head>
<body>
    <div></div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <h1>
        Book a board for the day
    </h1>
</head>
<body>
    <form method="post" action="/book">
        <div>
            <p>
                <label>Name</label>
                <input type="text" name="name">
            </p>
        </div>
        <div>
            <p>
                <label>Phone</label>
                <input type="tel" name="phone">
            </p>
        </div>
        <div>
            <p>
                <label>Email</label>
                <input type="email" name="email">
            </p>
        </div>
        <div>
            <p>
                <label>Size</label>
                <select name="size_requested">
                    {% for row in sizes %}
                        <option value="{{ row.size }}">{{ row.size }}</option>
                    {% endfor %}
                </select>
            </p>
        </div>
        <div>
            <p>
                <label>Wetsuit</label>
                <input type="checkbox" name="wetsuit" checked> 
            </p>
        </div>
        <div>
            <p>
                <label>Date</label>
                <input type="date" name="hire_date">
            </p>
        <div>
            <p>
                <button type="submit">Complete</button>
            </p>
        </div>
    </form>    
</body>
</html>

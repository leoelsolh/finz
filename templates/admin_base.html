{% extends 'base.html' %}

{% block header %}
	<header class="topbar admin-topbar">
		<a class="brand" href="/admin">Finz <span class="brand-tag">Counter</span></a>
		<form method="post" action="/admin/logout">
			<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
			<button type="submit" class="btn btn-quiet">Log out</button>
		</form>
	</header>
{% endblock %}

{% block body %}
	<div class="admin-layout">
		<nav class="admin-nav" aria-label="Admin sections">
			<a href="/admin" class="admin-nav-link{% if request.path == '/admin' %} is-active{% endif %}">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<path d="M3 10.75 12 4l9 6.75"/>
					<path d="M5.5 9.5V20h13V9.5"/>
				</svg>
				<span>Counter</span>
			</a>
			<a href="/admin/stock" class="admin-nav-link{% if request.path == '/admin/stock' %} is-active{% endif %}">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<path d="M12 3 3.5 7.5 12 12l8.5-4.5L12 3Z"/>
					<path d="M3.5 7.5v9L12 21l8.5-4.5v-9"/>
					<path d="M12 12v9"/>
				</svg>
				<span>Stock</span>
			</a>
			<a href="/admin/analytics" class="admin-nav-link{% if request.path == '/admin/analytics' %} is-active{% endif %}">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<path d="M4 20h16"/>
					<path d="M7 20v-5"/>
					<path d="M12 20V8"/>
					<path d="M17 20v-9"/>
				</svg>
				<span>Analytics</span>
			</a>
		</nav>
		<main class="admin-main">
			{% for message in get_flashed_messages() %}
				<p class="form-confirm" role="status">{{ message }}</p>
			{% endfor %}
			{% block admin_content %}{% endblock %}
		</main>
	</div>
{% endblock %}

{% block footer %}{% endblock %}
